# TC-010 / BUG-002 — El gasto de fin de mes permanece en su mes local.
#
# Precondicion: dispositivo en America/Mazatlan con la fecha fijada al 31 de
# enero, 23:50. En UTC ese instante ya es 1 de febrero, asi que un agrupamiento
# por UTC sacaria el gasto del total de enero.
#
# Alcance: la app muestra solo el mes actual, sin navegacion entre periodos, asi
# que este flujo verifica que el gasto entra al total del mes local. La
# verificacion del mes contiguo vive en date.test.ts, que si puede fijar ambas
# fechas sin depender del reloj del dispositivo.
appId: mx.eduardomaytorena.gastos
---
- runFlow: shared/login.yaml

- tapOn:
    id: "fab-agregar"
- tapOn:
    id: "input-monto"
- inputText: "300.00"
- tapOn:
    id: "categoria-otros"
- tapOn:
    id: "btn-guardar"

- assertVisible:
    id: "screen-lista"
# El encabezado debe seguir diciendo enero, y el total incluir el gasto.
- assertVisible: "enero"
- assertVisible: "$300.00"
